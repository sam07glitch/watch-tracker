name: Check Watch Stock

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # lets you also trigger it manually from GitHub

permissions:
  contents: write            # needed so it can save "last known status"

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4  

      - name: Run the stock checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch_restock_tracker.py

      - name: Save the latest stock status
        run: |
          git config user.name "Watch Tracker Bot"
          git config user.email "actions@github.com"
          git add stock_state.json
          git diff --staged --quiet || git commit -m "Update stock status"
          git push
